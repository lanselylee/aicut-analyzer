[project]
name = "aicut-analyzer"
version = "0.1.0"
description = "Footage quality analysis for AICUT: sharpness, stability and exposure per frame, and the best stretch of each clip"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
]

[project.scripts]
aicut-analyze = "aicut_analyzer.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
