[project]
name = "aicut-analyzer"
version = "0.1.0"
description = "Footage quality analysis for AICUT: sharpness, stability and exposure per frame, and the best stretch of each clip"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "scipy>=1.18.1",
]

[project.scripts]
aicut-analyze = "aicut_analyzer.cli:main"
aicut-talk = "aicut_analyzer.talk:main"
aicut-notes = "aicut_analyzer.notes:main"

[project.optional-dependencies]
plot = [
    "matplotlib>=3.11.2",
]
speech = [
    "mlx-whisper>=0.4.3",
    "opencc-python-reimplemented>=0.1.7",
]
llm = [
    "google-genai>=2.34.0",
    "pypinyin>=0.55.0",
]
asr = [
    "funasr>=1.4.20",
    "modelscope>=1.40.2",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
